# Pulls the latest posts from the cooties.io RSS feed into README.md.
name: Update latest posts

on:
  schedule:
    - cron: "0 20 * * *" # 06:00 in Brisbane
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: gautamkrishnar/blog-post-workflow@f177491c77670f150ab4e9b9890254d8eba4164b # 1.9.7
        with:
          feed_list: "https://cooties.io/rss.xml"
          max_post_count: 5
          template: "- **[$title]($url)** · $date<br>$description$newline"
          date_format: "mmm d, yyyy"
          commit_message: "chore: update latest posts"
